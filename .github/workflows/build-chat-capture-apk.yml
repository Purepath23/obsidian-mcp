name: Build Chat Capture APK

on:
  push:
    branches: [ "android-chat-capture" ]
    paths:
      - "android-chat-capture/**"
      - ".github/workflows/build-chat-capture-apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "android-chat-capture/**"
      - ".github/workflows/build-chat-capture-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-chat-capture
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-obsidian-capture-apk
          path: android-chat-capture/app/build/outputs/apk/debug/app-debug.apk
